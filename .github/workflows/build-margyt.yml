name: Build MargyT-based APK for VTok evaluation

on:
  push:
    branches:
      - margyt-import
    paths:
      - .github/workflows/build-margyt.yml
  workflow_dispatch:
    inputs:
      asset_url:
        description: "Direct HTTPS URL to TikTok universal APK. Defaults to the pinned TikTok 47.5.3 APK."
        required: false
        default: "https://d.apkpure.com/b/APK/com.zhiliaoapp.musically?versionCode=2024705030"
        type: string

permissions:
  contents: read

concurrency:
  group: vtok-margyt-evaluation
  cancel-in-progress: false

env:
  EXPECTED_SOURCE_SHA256: "6670ca3f93bfea379658cad3c27f05d3a380b23a0d82569cce684b7453e8ff3e"

jobs:
  patch:
    name: Patch and validate TikTok 47.5.3 with MargyT
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout VTok
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate source URL
        env:
          ASSET_URL: ${{ inputs.asset_url }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from urllib.parse import urlparse
          u = urlparse(os.environ["ASSET_URL"])
          if u.scheme != "https" or not u.netloc:
              raise SystemExit("asset_url must be a valid HTTPS URL")
          PY

      - name: Download and validate pinned TikTok APK
        env:
          ASSET_URL: ${{ inputs.asset_url }}
          EXPECTED_SHA256: ${{ env.EXPECTED_SOURCE_SHA256 }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-all-errors --connect-timeout 30 --max-time 2400 "$ASSET_URL" -o source.apk
          test -s source.apk
          actual="$(sha256sum source.apk | cut -d' ' -f1)"
          echo "$actual  source.apk" | tee source-sha256.txt
          if [ "$actual" != "$EXPECTED_SHA256" ]; then
            echo "::error::Downloaded APK is not the pinned TikTok 47.5.3 build. Expected $EXPECTED_SHA256, got $actual"
            exit 1
          fi
          python - <<'PY'
          import zipfile
          with zipfile.ZipFile("source.apk") as z:
              bad = z.testzip()
              if bad:
                  raise SystemExit("Corrupt APK entry: " + bad)
              names = z.namelist()
              if "AndroidManifest.xml" not in names:
                  raise SystemExit("Missing AndroidManifest.xml")
              if not any(n.endswith(".dex") for n in names):
                  raise SystemExit("No DEX files found")
              libs = {n.split("/")[1] for n in names if n.startswith("lib/") and n.count("/") >= 2}
              if not {"arm64-v8a", "armeabi-v7a"}.issubset(libs):
                  raise SystemExit("Expected universal APK with arm64-v8a and armeabi-v7a native libraries")
          print("Pinned source APK SHA-256, ZIP integrity, DEX, and universal ABI checks: PASS")
          PY

      - name: Fetch upstream MargyT source
        run: |
          set -euo pipefail
          git clone --depth 1 https://git.narez.xyz/narezany/MargyT.git upstream
          test -f upstream/README.md
          test -f upstream/margyt/__main__.py
          test -f upstream/margyt/build.py
          test -f upstream/LICENSE
          test -f upstream/ADDITIONAL-TERMS.md
          test -f upstream/build.sh
          python -m py_compile upstream/margyt/*.py
          java -version
          python --version
          echo "Upstream source files, license notices, and Python syntax: PASS"

      - name: Patch source APK with MargyT
        env:
          MARGYT_WORKERS: "2"
        run: |
          set -euo pipefail
          mkdir -p build
          cd upstream
          python -m margyt ../source.apk --no-push --accent FFC857 -o ../build/vtok-margyt-based-evaluation.apk

      - name: Validate patched APK and write report
        run: |
          set -euo pipefail
          test -s build/vtok-margyt-based-evaluation.apk
          python - <<'PY'
          import os, zipfile
          path = "build/vtok-margyt-based-evaluation.apk"
          with zipfile.ZipFile(path) as z:
              bad = z.testzip()
              if bad:
                  raise SystemExit(f"Patched APK ZIP integrity failed at {bad}")
              names = z.namelist()
              if "AndroidManifest.xml" not in names:
                  raise SystemExit("Patched APK is missing AndroidManifest.xml")
              if not any(n.endswith(".dex") for n in names):
                  raise SystemExit("Patched APK is missing DEX files")
          print(f"Patched APK ZIP integrity: PASS ({os.path.getsize(path)} bytes)")
          PY
          sha256sum build/vtok-margyt-based-evaluation.apk | tee patched-apk-sha256.txt
          {
            echo "Build result: PASS (archive validation only; not device-tested)"
            echo "Target: TikTok 47.5.3 universal APK"
            echo "Branding: VTok-based evaluation build"
            echo "Upstream: MargyT (GPL-3.0 with ADDITIONAL-TERMS.md)"
            echo "Source APK SHA-256: $(cut -d' ' -f1 source-sha256.txt)"
            echo "Patched APK SHA-256: $(cut -d' ' -f1 patched-apk-sha256.txt)"
          } | tee build-report.txt

      - name: Upload evaluation APK and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vtok-margyt-based-evaluation
          path: |
            build/vtok-margyt-based-evaluation.apk
            source-sha256.txt
            patched-apk-sha256.txt
            build-report.txt
          if-no-files-found: warn
          retention-days: 14
