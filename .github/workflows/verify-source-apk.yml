name: Verify TikTok source APK

on:
  workflow_dispatch:
    inputs:
      asset_url:
        description: "Direct HTTPS download URL for the original APK"
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: Download and inspect APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y python3

      - name: Download APK
        env:
          ASSET_URL: ${{ inputs.asset_url }}
        run: |
          set -euo pipefail
          case "$ASSET_URL" in
            https://*) ;;
            *) echo "Only HTTPS download URLs are accepted." >&2; exit 2 ;;
          esac
          curl --fail --location --retry 3 --retry-delay 2 --max-time 1500 "$ASSET_URL" -o source.apk
          test -s source.apk
          printf 'Downloaded bytes: %s\n' "$(stat -c %s source.apk)" | tee verification-report.txt
          sha256sum source.apk | tee -a verification-report.txt

      - name: Validate APK archive and every entry
        id: validate
        run: |
          python3 - <<'PY'
          import sys, zipfile
          report = "verification-report.txt"
          errors = []
          try:
              with zipfile.ZipFile("source.apk") as archive:
                  names = archive.namelist()
                  print(f"ZIP entries: {len(names)}")
                  with open(report, "a", encoding="utf-8") as out:
                      out.write(f"ZIP entries: {len(names)}\n")
                      out.write(f"AndroidManifest.xml present: {'AndroidManifest.xml' in names}\n")
                      out.write(f"classes.dex present: {'classes.dex' in names}\n")
                  for name in names:
                      try:
                          with archive.open(name) as stream:
                              while stream.read(1024 * 1024):
                                  pass
                      except Exception as exc:
                          errors.append(f"{name}: {type(exc).__name__}: {exc}")
              if "AndroidManifest.xml" not in names:
                  errors.append("Missing AndroidManifest.xml")
              if not any(name == "classes.dex" or name.startswith("classes") and name.endswith(".dex") for name in names):
                  errors.append("No DEX file found")
          except Exception as exc:
              errors.append(f"Archive open failed: {type(exc).__name__}: {exc}")
          with open(report, "a", encoding="utf-8") as out:
              if errors:
                  out.write("RESULT: FAIL\n")
                  for error in errors:
                      out.write(f"ERROR: {error}\n")
              else:
                  out.write("RESULT: PASS - all archive entries read without errors\n")
          print("\n".join(errors) if errors else "All entries read successfully")
          sys.exit(1 if errors else 0)
          PY

      - name: Upload report (also on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-apk-verification-report
          path: verification-report.txt
          if-no-files-found: warn
          retention-days: 14
