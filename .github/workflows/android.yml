name: VTok Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, margyt-import]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: vtok-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile and verify APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Print toolchain versions
        run: |
          java -version
          gradle --version
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml

      - name: Validate Gradle configuration
        run: gradle --no-daemon --stacktrace tasks

      - name: Run Android lint and compile Kotlin
        run: gradle --no-daemon --stacktrace --warning-mode all lintDebug

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace --warning-mode all assembleDebug

      - name: Verify APK exists and is non-empty
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload lint reports (including on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VTok-lint-reports
          path: app/build/reports/lint-results*
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: VTok-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
